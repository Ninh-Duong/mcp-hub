name: Desktop release

# Builds the desktop app's installer and publishes it, with its SHA-256, as a GitHub Release. It runs:
# - on a push to master when no Release `v<project version>` exists yet: raising the version in pyproject.toml
#   and merging is the release, and this workflow creates the tag itself;
# - on a push of a tag `v<project version>`: the manual fallback;
# - by hand (workflow_dispatch): builds and checks the installer without publishing.
# The installer is never committed (build/ and dist/ are ignored).
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the project version
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Decide whether to build and publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          build=false
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the project version $TAG."
              exit 1
            fi
            build=true
            publish=true
          elif gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to publish."
          else
            build=true
            publish=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  installer:
    name: Build the installer
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # create the release and attach the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Run package QC
        shell: pwsh
        run: |
          uv sync --locked --python 3.12
          uv run --locked --python 3.12 python scripts/package_qc.py
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: uv run --locked --python 3.12 --group build python scripts/build_desktop.py
      - name: Write its SHA-256
        shell: pwsh
        run: |
          foreach ($installer in Get-ChildItem dist -Filter "mcp-hub-status-setup-*.exe") {
              $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Set-Content -LiteralPath "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -Encoding ascii -NoNewline
          }
      - name: Publish the release
        if: needs.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # A tag push names an existing tag; a push to master creates it at the commit that was built.
          $target = if ($env:GITHUB_REF_TYPE -eq 'tag') { @('--verify-tag') } else { @('--target', $env:GITHUB_SHA) }
          $files = @(Get-ChildItem dist -Filter "mcp-hub-status-setup-*" | ForEach-Object FullName)
          gh release create $env:TAG @files @target --generate-notes --title "mcp-hub Status $env:TAG"
