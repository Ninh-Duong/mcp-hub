name: Package QC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qc:
    name: QC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Qt system libraries (Linux)
        # The desktop status app's window tests run on Qt's offscreen platform, which still loads these.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12
      - name: Run package QC
        env:
          # Also run the launcher end-to-end test in a fresh uv environment (needs network).
          MCP_HUB_E2E: "1"
        run: uv run --locked --python 3.12 python scripts/package_qc.py
