[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub"
version = "0.1.0"
description = "Local config-driven MCP gateway for AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "httpx2>=2.0",
    "starlette>=0.40",
    # Not imported by the Hub: mcp-jira-sync and mcp-read-source run on this venv (config.py).
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "openai>=1.75",
    "anthropic>=0.45",
    "google-genai>=1.0",
    "jsonschema>=4.0",
    "uvicorn>=0.30",
]

[project.scripts]
mcp-hub = "mcp_hub.server:main"
mcp-hub-service = "mcp_hub.service:main"
mcp-hub-bridge = "mcp_hub.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_hub = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css", "dashboard/locales/*.json"]
