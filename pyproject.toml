[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub"
version = "0.1.0"
description = "Local config-driven MCP gateway for AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-hub = "mcp_hub.server:main"

[tool.setuptools.packages.find]
where = ["src"]
